services:
  zookeeper:
    image: confluentinc/cp-zookeeper:7.3.0
    container_name: zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"
    networks:
      - dados

  kafka-broker:
    image: confluentinc/cp-kafka:7.3.0
    container_name: kafka-broker
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      # Define 10 partições como padrão para novos tópicos
      KAFKA_NUM_PARTITIONS: 10
      KAFKA_BROKER_ID: 101
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka-broker:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    networks:
      - dados

  schema-registry:
    image: confluentinc/cp-schema-registry:7.3.0
    container_name: schema-registry
    ports:
      - "8081:8081"
    depends_on:
      - zookeeper
      - kafka-broker
    environment:
      SCHEMA_REGISTRY_HOST_NAME: schema-registry
      SCHEMA_REGISTRY_LISTENERS: "http://0.0.0.0:8081"
      SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS: "PLAINTEXT://kafka-broker:29092"
    networks:
      - dados

  pgvector:
    image: pgvector/pgvector:pg16
    container_name: pgvector
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_USER: postgres
      POSTGRES_DB: postgres
    ports:
      - "5432:5432"
    command: ["postgres", "-c", "wal_level=logical"]
    volumes:
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - dados

  minio:
    image: quay.io/minio/minio:latest
    container_name: minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: admin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server --console-address ":9001" /data
    networks:
      - dados

  minio-setup:
    image: minio/mc
    container_name: minio-setup
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      sleep 5;
      mc alias set local http://minio:9000 admin minioadmin;
      mc mb local/bronze;
      mc anonymous set public local/bronze;
      exit 0;
      "
    networks:
      - dados

  # ==========================================
  # MONGODB REPLICA SET (3 NÓS)
  # ==========================================
  mongo1:
    image: mongo:7.0
    container_name: mongo1
    command: ["--replSet", "rs0", "--bind_ip_all", "--port", "27017"]
    ports:
      - "27017:27017"
    healthcheck:
      test: echo "try { rs.status() } catch (err) { rs.initiate({_id:'rs0',members:[{_id:0,host:'mongo1:27017'},{_id:1,host:'mongo2:27017'},{_id:2,host:'mongo3:27017'}]}) }" | mongosh --port 27017 --quiet
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 10s
    volumes:
      - mongo1_data:/data/db
    networks:
      - dados

  mongo2:
    image: mongo:7.0
    container_name: mongo2
    command: ["--replSet", "rs0", "--bind_ip_all", "--port", "27017"]
    volumes:
      - mongo2_data:/data/db
    networks:
      - dados

  mongo3:
    image: mongo:7.0
    container_name: mongo3
    command: ["--replSet", "rs0", "--bind_ip_all", "--port", "27017"]
    volumes:
      - mongo3_data:/data/db
    networks:
      - dados

  mongo-setup:
    image: mongo:7.0
    container_name: mongo-setup
    depends_on:
      mongo1:
        condition: service_healthy
      mongo2:
        condition: service_started
      mongo3:
        condition: service_started
    command: >
      bash -c "
        echo 'Aguardando inicialização do Replica Set...';
        sleep 10;
        mongosh --host mongo1:27017 --eval 'rs.status()';
        echo 'Replica Set configurado com sucesso!';
      "
    networks:
      - dados

  # ==========================================
  # KAFKA CONNECT (STRIMZI BASE)
  # ==========================================
  kafka-connect:
    build: .
    container_name: kafka-connect
    depends_on:
      - kafka-broker
      - schema-registry
    ports:
      - "8083:8083"
    volumes:
      - "./conectores:/conectores"
    networks:
      - dados
    # ADICIONADO: Variável de ambiente para redirecionar os logs do Kafka para o console/stdout
    environment:
      - LOG_DIR=/tmp
      - OTEL_SERVICE_NAME=kafka-connect
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4317
      - OTEL_TRACES_SAMPLER=always_on
      - OTEL_TRACES_EXPORTER=otlp
      - OTEL_METRICS_EXPORTER=none
      - STRIMZI_TRACING=opentelemetry
    # CORREÇÃO: Gerando o arquivo no /tmp onde o usuário kafka tem permissão de escrita
    command: |
      bash -c '
      echo "Gerando arquivo de configuração do Kafka Connect..."
      cat <<EOF > /tmp/custom-connect-distributed.properties
      bootstrap.servers=kafka-broker:29092
      rest.advertised.host.name=kafka-connect
      rest.port=8083
      group.id=compose-connect-group
      config.storage.topic=docker-connect-configs
      offset.storage.topic=docker-connect-offsets
      status.storage.topic=docker-connect-status
      config.storage.replication.factor=1
      offset.storage.replication.factor=1
      status.storage.replication.factor=1
      key.converter=org.apache.kafka.connect.storage.StringConverter
      value.converter=io.confluent.connect.avro.AvroConverter
      value.converter.schema.registry.url=http://schema-registry:8081
      header.converter=org.apache.kafka.connect.storage.SimpleHeaderConverter
      plugin.path=/tmp/connect-plugins,/usr/share/java,/usr/share/confluent-hub-components
      EOF
      
      echo "Iniciando Kafka Connect do Strimzi..."
      exec /opt/kafka/bin/connect-distributed.sh /tmp/custom-connect-distributed.properties
      '

  connect-setup:
    image: curlimages/curl:8.5.0
    container_name: connect-setup
    depends_on:
      - kafka-connect
    entrypoint:
      - /bin/sh
      - -c
      - |
        echo "Aguardando Kafka Connect..."
        while ! curl -s http://kafka-connect:8083/connectors; do sleep 10; done;

        echo "Criando Debezium Postgres Source..."
        curl -X POST http://kafka-connect:8083/connectors -H "Content-Type: application/json" -d '{
          "name": "postgres-source-connector",
          "config": {
            "connector.class": "io.debezium.connector.postgresql.PostgresConnector",
            "tasks.max": "1",
            "database.hostname": "pgvector",
            "database.port": "5432",
            "database.user": "postgres",
            "database.password": "postgres",
            "database.dbname": "postgres",
            "table.include.list": "public.orders",
            "plugin.name": "pgoutput",
            "topic.prefix": "pgserver",
            "key.converter": "org.apache.kafka.connect.storage.StringConverter",
            "value.converter": "org.apache.kafka.connect.json.JsonConverter",
            "transforms": "unwrap",
            "transforms.unwrap.type": "io.debezium.transforms.ExtractNewRecordState",
            "transforms.unwrap.drop.tombstones": "false",
            "transforms.unwrap.delete.handling.mode": "rewrite",
            "transforms.unwrap.add.fields": "op,source.ts_ms"
          }
        }'

        echo "Criando S3 Parquet Sink..."
        curl -X POST http://kafka-connect:8083/connectors -H "Content-Type: application/json" -d '{
          "name": "s3-sink",
          "config": {
            "connector.class": "io.confluent.connect.s3.S3SinkConnector",
            "tasks.max": "1",
            "topics": "pgserver.public.orders",
            "s3.bucket.name": "bronze",
            "s3.region": "us-east-1",
            "store.url": "http://minio:9000",
            "aws.access.key.id": "admin",
            "aws.secret.access.key": "minioadmin",
            "s3.path.style.access": "true",

            "storage.class": "io.confluent.connect.s3.storage.S3Storage",
            "format.class": "io.confluent.connect.s3.format.json.JsonFormat",
            "flush.size": "50",
            "rotate.schedule.interval.ms": "36000",
            "timezone": "America/Sao_Paulo",
            "partitioner.class": "io.confluent.connect.storage.partitioner.DefaultPartitioner",
            "key.converter": "org.apache.kafka.connect.storage.StringConverter",
            "value.converter": "org.apache.kafka.connect.json.JsonConverter",
            "value.converter.schema.registry.url": "http://schema-registry:8081",
            "value.converter.schemas.enable": "false",
            "schema.compatibility": "NONE",
            "confluent.topic.bootstrap.servers": "kafka:29092",
            "confluent.topic.replication.factor": "1"
          }
        }'

        echo "Criando MongoDB Sink..."
        curl -X POST http://kafka-connect:8083/connectors -H "Content-Type: application/json" -d '{
          "name": "mongo-sink",
          "config": {
            "connector.class": "com.mongodb.kafka.connect.MongoSinkConnector",
            "tasks.max": "1",
            "topics": "pgserver.public.orders",
            "connection.uri": "mongodb://mongo1:27017,mongo2:27017,mongo3:27017/?replicaSet=rs0",
            "database": "analytics_db",
            "collection": "orders_agg",
            "key.converter": "org.apache.kafka.connect.storage.StringConverter",
            "value.converter": "org.apache.kafka.connect.json.JsonConverter",
            "value.converter.schemas.enable": "false",
            "schema.compatibility": "NONE",
            "decimal.format": "numeric",
            "value.converter.schema.registry.url": "http://schema-registry:8081"
          }
        }'
    networks:
      - dados

  akhq:
    image: tchiotludo/akhq:latest
    container_name: akhq
    environment:
      AKHQ_CONFIGURATION: |
        akhq:
          connections:
            docker-kafka-server:
              properties:
                bootstrap.servers: "kafka-broker:29092"
              connect:
                - name: "connect"
                  url: "http://kafka-connect:8083"
    ports:
      - "8080:8080"
    depends_on:
      - kafka-broker
      - kafka-connect
    networks:
      - dados

  cloudbeaver:
    image: dbeaver/cloudbeaver:latest
    container_name: cloudbeaver
    ports:
      - "8978:8978"
    networks:
      - dados

  metabase:
    image: metabase/metabase:latest
    container_name: metabase
    depends_on:
      - pgvector
      - mongo-setup
    ports:
      - "3000:3000"
    networks:
      - dados


  fast-api-fia:
    image: fast-api-fia
    ports:
      - "8000:8000"   
    container_name: fast-api-fia 
    volumes:
      - .:/home/app/api   
    depends_on:
      - mongo-setup
    environment:
      - MONGO_URI=mongodb://mongo1:27017/analytics_db
    stdin_open: true
    tty: true 
    networks:
      - dados



networks:
  dados:
    driver: bridge

volumes:
  mcs-mysql:
  mcs-columnstore:
  mcs-etc-columnstore:
  mcs-my-cnf:
  mongo1_data:
  mongo2_data:
  mongo3_data: